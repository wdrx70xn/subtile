name: Release-plz
'on':
  push:
    branches:
    - main
jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    environment: publishing
    if: ${{ github.repository_owner == 'wdrx70xn' }}
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_PLZ_TOKEN }}
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Authenticate with crates.io
      uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - name: Run release-plz
      uses: release-plz/action@v0.5
      with:
        command: release
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'wdrx70xn' }}
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_PLZ_TOKEN }}
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - name: Install cargo-readme
      run: cargo install cargo-readme
    - name: Run release-plz
      id: release-plz-pr
      uses: release-plz/action@v0.5
      with:
        command: release-pr
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    - name: Update README with cargo-readme in the release PR
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        PR: ${{ steps.release-plz-pr.outputs.pr }}
      run: "set -e\n\npr_number=${{ fromJSON(steps.release-plz-pr.outputs.pr).number\
        \ }}\nif [[ -n \"$pr_number\" ]]; then\n  gh pr checkout $pr_number\n  cargo\
        \ readme > README.md\n  git add .\n  git commit --amend --no-edit\n  git push\
        \ -f\nfi\n"
